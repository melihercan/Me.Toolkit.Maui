name: Publish

# One workflow for every package, because a NuGet Trusted Publishing policy is bound to a single
# workflow file *and* a single repository. Keeping this as one file means one policy - scoped to
# "Me.Toolkit.Maui.*" - covers all three packages, every future version, and any future one.
#
# Ways in:
#   * tag v<version>                — publishes every package
#   * tag configuration-v<version>  — publishes Me.Toolkit.Maui.Configuration only
#   * tag hosting-v<version>        — publishes Me.Toolkit.Maui.Hosting only
#   * tag webhostpatch-v<version>   — publishes Me.Toolkit.Maui.WebHostPatch only
#   * run manually                  — defaults to a dry run that packs and uploads the .nupkg
#                                     files as build artifacts without publishing anything
#
# Me.Toolkit.Maui.Nfc is deliberately absent. It builds, ships in the demo and has tests, but its reading
# session is unfinished, so the project sets IsPackable=false and there is nothing here to pack.
on:
  push:
    tags:
      - 'v*'
      - 'configuration-v*'
      - 'hosting-v*'
      - 'webhostpatch-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to publish'
        type: choice
        options: [all, configuration, hosting, webhostpatch]
        default: all
      dry-run:
        description: 'Pack only, do not push to NuGet'
        type: boolean
        default: true
      skip-duplicate:
        description: 'Treat "already exists" as success (only for re-running a release already out)'
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

env:
  CONFIGURATION_PROJECT: Me.Toolkit.Maui.Configuration/Me.Toolkit.Maui.Configuration.csproj
  HOSTING_PROJECT: Me.Toolkit.Maui.Hosting/Me.Toolkit.Maui.Hosting.csproj
  WEBHOSTPATCH_PROJECT: Me.Toolkit.Maui.WebHostPatch/Me.Toolkit.Maui.WebHostPatch.csproj

jobs:
  publish:
    name: Pack and publish
    # windows-latest, and this is not a preference. Directory.Build.props builds net10.0-ios and
    # net10.0-maccatalyst only off Linux, and net10.0-windows10.0.19041.0 only on Windows, so
    # packing on ubuntu-latest would produce packages containing two target frameworks instead of
    # five - and it would do it silently, with a green tick, publishing a package that simply does
    # not support iOS, Mac Catalyst or Windows. The "all five target frameworks" step below turns
    # that from a comment into a failure.
    runs-on: windows-latest

    permissions:
      contents: read
      # Lets the job request a GitHub OIDC token, which nuget.org exchanges for a
      # short-lived API key. Nothing long-lived is stored in the repository.
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Reads the solution and installs exactly the workloads its target frameworks need, rather
      # than a hardcoded list that would drift from Directory.Build.props.
      - name: Install MAUI workloads
        run: dotnet workload restore Me.Toolkit.Maui.slnx

      # Works out which projects this run covers, and which version a tag claims.
      - name: Resolve targets
        id: targets
        run: |
          set -euo pipefail
          all="$CONFIGURATION_PROJECT $HOSTING_PROJECT $WEBHOSTPATCH_PROJECT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            case "${{ inputs.package }}" in
              configuration) projects="$CONFIGURATION_PROJECT" ;;
              hosting)       projects="$HOSTING_PROJECT" ;;
              webhostpatch)  projects="$WEBHOSTPATCH_PROJECT" ;;
              *)             projects="$all" ;;
            esac
            # No tag, so no version to pack with. The build date is the scheme, written the way
            # NuGet stores it, so a manual run produces what a tag cut today would.
            version=$(date -u +%y.%-m.%-d)
          else
            case "$GITHUB_REF_NAME" in
              configuration-v*) projects="$CONFIGURATION_PROJECT"; version="${GITHUB_REF_NAME#configuration-v}" ;;
              hosting-v*)       projects="$HOSTING_PROJECT";       version="${GITHUB_REF_NAME#hosting-v}" ;;
              webhostpatch-v*)  projects="$WEBHOSTPATCH_PROJECT";  version="${GITHUB_REF_NAME#webhostpatch-v}" ;;
              v*)               projects="$all";                   version="${GITHUB_REF_NAME#v}" ;;
              *)                echo "::error::Unrecognised tag $GITHUB_REF_NAME"; exit 1 ;;
            esac
          fi
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Projects: $projects"
          echo "Version:  ${version:-(not checked)}"

      # No csproj declares a version any more, so there is nothing for a tag to disagree with -
      # the tag is the only place a version is written, and both build and pack are told what
      # it is below.
      #
      # The tag may be written either way round. Dates read naturally with the zeros in -
      # 26.09.14 is the 14th of September - but NuGet strips them, so that tag publishes as
      # 26.9.14, and every file name, search result and `dotnet add package` shows the stripped
      # form. Rather than forbid the readable spelling, normalise it here: the tag is for people,
      # the normalised version is what ships, and the two cannot drift because only one of them
      # is ever written down.
      - name: Normalise the version
        id: version
        if: steps.targets.outputs.version != ''
        run: |
          set -euo pipefail
          tag='${{ steps.targets.outputs.version }}'
          normalised=$(echo "$tag" | awk -F. '{for(i=1;i<=NF;i++) printf "%s%s", ($i+0), (i<NF?".":"")}')
          if [ "$normalised" != "$tag" ]; then
            echo "::notice::Tag $GITHUB_REF_NAME reads $tag; publishing as $normalised, which is how NuGet stores it."
          fi
          echo "value=$normalised" >> "$GITHUB_OUTPUT"
          echo "Publishing version $normalised"

      # All four libraries, including the one that is never packed: the tests read every library's
      # compiled assemblies off disk through MetadataLoadContext rather than referencing them, so
      # PublicApiSurfaceTests and MultiTargetingTests fail outright if Me.Toolkit.Maui.Nfc has not been built
      # in this configuration. DemoApp is excluded for the same reason as in ci.yml - it is an app,
      # it is slow, and nothing in it ships.
      - name: Build libraries
        shell: pwsh
        env:
          # From the tag on a release, from today's date on a manual run. Never a csproj.
          VERSION: ${{ steps.version.outputs.value || steps.targets.outputs.version }}
        run: |
          foreach ($project in 'Me.Toolkit.Maui.Configuration','Me.Toolkit.Maui.Hosting','Me.Toolkit.Maui.Nfc','Me.Toolkit.Maui.WebHostPatch') {
            dotnet build "$project/$project.csproj" --configuration Release -warnaserror -p:Version="$env:VERSION"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Never publish a package whose tests do not pass.
      #
      # Do not add --nologo, -warnaserror, or any other flag Microsoft.Testing.Platform does not
      # know: it forwards unrecognised arguments to the test executable, which exits 5 having run
      # nothing. See the same warning in ci.yml, where it really happened.
      - name: Test
        run: dotnet test --project Me.Toolkit.Maui.Tests/Me.Toolkit.Maui.Tests.csproj --configuration Release

      # --no-build, so what is published is exactly what the tests just ran against.
      - name: Pack
        env:
          # From the tag on a release, from today's date on a manual run. Never a csproj.
          VERSION: ${{ steps.version.outputs.value || steps.targets.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION" || { echo "::error::No version resolved."; exit 1; }
          for project in ${{ steps.targets.outputs.projects }}; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --output artifacts \
              -p:Version="$VERSION" \
              -p:ContinuousIntegrationBuild=true
          done

      - name: Show package contents
        shell: pwsh
        run: |
          foreach ($package in Get-ChildItem artifacts/*.nupkg) {
            Write-Host "== $($package.Name)"
            $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            $zip.Entries | ForEach-Object { Write-Host "   $($_.FullName)" }
            $zip.Dispose()
          }

      # The runner comment above, enforced. A package built on the wrong operating system is still
      # a valid package - it just quietly supports two platforms instead of five, and nobody finds
      # out until an iOS app fails to restore it.
      - name: Verify every package carries all five target frameworks
        shell: pwsh
        run: |
          $expected = 'net10.0', 'net10.0-android', 'net10.0-ios', 'net10.0-maccatalyst', 'net10.0-windows'
          $failed = $false

          foreach ($package in Get-ChildItem artifacts/*.nupkg) {
            $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            $frameworks = $zip.Entries.FullName |
              Where-Object { $_ -like 'lib/*' } |
              ForEach-Object { $_.Split('/')[1] } |
              Sort-Object -Unique
            $zip.Dispose()

            foreach ($framework in $expected) {
              # Prefix match, because the platform versions are stamped in: net10.0-android36.0.
              # net10.0 itself is matched exactly first, so it is not satisfied by net10.0-android.
              $found = $frameworks | Where-Object { $_ -eq $framework -or $_ -like "$framework*" }
              if (-not $found) {
                Write-Host "::error::$($package.Name) has no $framework slice. Found: $($frameworks -join ', ')"
                $failed = $true
              }
            }

            Write-Host "$($package.Name): $($frameworks -join ', ')"
          }

          if ($failed) { exit 1 }

      # 26.9.8 was published with the right package ID wrapped around assemblies still called
      # Mauime.*, because only <PackageId> had been changed at that point to test whether the prefix
      # was accepted at all. Everything built and packed correctly; the mismatch was invisible until
      # someone unzipped what was already on nuget.org. A published version cannot be replaced, so
      # this is checked before the push rather than trusted afterwards.
      - name: Verify every assembly matches its package ID
        shell: pwsh
        run: |
          $failed = $false

          foreach ($package in Get-ChildItem artifacts/*.nupkg) {
            # Me.Toolkit.Maui.Hosting.26.9.9.nupkg -> Me.Toolkit.Maui.Hosting
            $id = $package.Name -replace '\.\d+\.\d+\.\d+(\.\d+)?(-[A-Za-z0-9.-]+)?\.nupkg$', ''

            $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            $assemblies = $zip.Entries.FullName | Where-Object { $_ -like 'lib/*' -and $_ -like '*.dll' }
            $zip.Dispose()

            $wrong = $assemblies | Where-Object { [IO.Path]::GetFileNameWithoutExtension($_) -ne $id }
            if ($wrong) {
              foreach ($entry in $wrong) {
                Write-Host "::error::$($package.Name) declares id $id but contains $entry"
              }
              $failed = $true
            } else {
              Write-Host "$($package.Name): all $($assemblies.Count) assemblies named $id"
            }
          }

          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

      # Trusted Publishing: swap a GitHub OIDC token for an API key that nuget.org
      # issues for one hour. Requested immediately before the push, because the key
      # expires and each token buys exactly one key.
      #
      # Requires a Trusted Publishing policy on nuget.org naming this repository and
      # this workflow file, scoped to Me.Toolkit.Maui.*. No API key secret is involved.
      - name: NuGet login
        if: github.event_name == 'push' || inputs.dry-run == false
        id: login
        uses: NuGet/login@v1
        with:
          user: melihercan

      # The glob is expanded here rather than handed to dotnet as a quoted string. Quoted, bash does
      # not expand it and dotnet nuget push does not either, so the first attempt at publishing
      # failed with "File does not exist (artifacts/*.nupkg)" - after a successful OIDC login, which
      # burns the token. Pushing one file at a time also means the log names each package.
      #
      # --skip-duplicate makes a re-run harmless when a version really is already published, but it
      # is not free: on the first publish of these packages nuget.org answered 409 Conflict for IDs
      # that existed nowhere - not in the search index, not under the owner account - and
      # --skip-duplicate turned that rejection into a green tick claiming success. Hence the switch,
      # so a run can be repeated with the raw server response visible.
      - name: Push to NuGet
        if: github.event_name == 'push' || inputs.dry-run == false
        env:
          # A tag push never skips duplicates. --skip-duplicate exists for deliberately re-running a
          # release that is already out, and it cannot tell that case apart from a hard refusal: the
          # first attempt to publish these packages got 409 "The package ID is reserved" three times
          # and reported success, because that is a 409 like any other. Only a manual run can ask
          # for it, and then it is the operator's choice rather than the default.
          #
          # Both branches are non-empty strings on purpose. GitHub's "condition && a || b" idiom
          # silently returns b whenever a is falsy, and '' is falsy, so a branch of '' can never win.
          SKIP_DUPLICATE: ${{ (github.event_name == 'workflow_dispatch' && inputs.skip-duplicate) && 'yes' || 'no' }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(artifacts/*.nupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No packages found in artifacts/ to push."
            exit 1
          fi

          skip=()
          if [ "$SKIP_DUPLICATE" = "yes" ]; then
            skip=(--skip-duplicate)
          fi
          echo "skip-duplicate: $SKIP_DUPLICATE"

          for package in "${packages[@]}"; do
            echo "Pushing $package"

            if dotnet nuget push "$package" \
                 --api-key "$NUGET_API_KEY" \
                 --source https://api.nuget.org/v3/index.json \
                 "${skip[@]}"; then
              continue
            fi

            # dotnet nuget push reports the status line and throws the response body away, which is
            # where nuget.org puts the reason. Ask again with curl purely to read that body, then
            # fail. This can itself publish if the original failure was client-side; the log makes
            # clear which request did what.
            echo "::group::Raw nuget.org response for $package"
            # X-NuGet-Client-Version is required: without it nuget.org answers 400 "a client version
            # '4.1.0' or higher is required" before it ever looks at the package, which says nothing
            # about why the real push failed.
            curl -sS -X PUT \
              -H "X-NuGet-ApiKey: $NUGET_API_KEY" \
              -H "X-NuGet-Client-Version: 6.0.0" \
              -F "package=@$package" \
              -D - \
              -w '\nHTTP %{http_code}\n' \
              https://www.nuget.org/api/v2/package || true
            echo "::endgroup::"

            echo "::error::Pushing $package failed; see the raw response above."
            exit 1
          done

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: echo "::notice::Dry run - packages built and uploaded as artifacts, nothing published."
